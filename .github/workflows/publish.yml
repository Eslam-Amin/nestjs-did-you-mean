name: Publish to NPM

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for NPM Provenance cryptographic signatures

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript Definitions
        run: npm run typecheck

      - name: Run Test Suites
        run: npm test

      - name: Build Dual Bundles (CJS & ESM)
        run: npm run build

      - name: Publish to NPM via Trusted Publishing (OIDC)
        run: npm publish --access public --provenance

